[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "otool-esptool-ui"
version = "0.7.2"
description = "Windows ESP workbench for flashing, eFuse, serial verification, firmware images and terminals"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "ONEXS"}]
license = {file = "LICENSE"}
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "PyQt6==6.11.0",
    "esptool==5.6.0",
    "littlefs-python==0.19.0",
    "bitstring==4.4.0",
    "cryptography==50.0.2",
    "pyserial==3.5",
    "pyte==0.8.2",
    "wcwidth==0.9.1",
    "reedsolo==1.7.0",
    "PyYAML==6.0.3",
    "intelhex==2.3.0",
    "rich-click==1.9.9",
    "click==8.5.0",
    "esp-pylib[cli,ide,serial]==1.1.5",
]

[project.optional-dependencies]
build = [
    "PyInstaller==6.22.3",
    "pyinstaller-hooks-contrib==2026.8",
    "setuptools==84.0.0",
    "pip==26.2.1",
]

[project.scripts]
otool-esptool-ui = "otool_esptool_ui:main"

[tool.setuptools]
packages = ["otool_esptool_ui", "otool_esptool_ui.src"]

[tool.setuptools.package-dir]
otool_esptool_ui = "."

[tool.setuptools.package-data]
otool_esptool_ui = [
    "config.yaml",
    "THIRD_PARTY_NOTICES.md",
    "logo_all_size.ico",
    "assets/*.png",
]
"otool_esptool_ui.src" = ["assets/*.svg", "assets/*.ps1"]
